        ], rows: S.divs }));
    } else if (sec === 'plans') {

      panel = h('div', { className: 'tr-org__panel' }, h('h2', null, 'Payment plans'), h('p', null, 'Offer up to 12 plans. The suggested plan is preselected for clubs, which keeps checkout to one decision for most.'),
        h('div', { className: 'tr-plans', role: 'radiogroup', 'aria-label': 'Suggested plan' }, S.plans.map(function (pl) {
          function upd(k, v) { set({ plans: S.plans.map(function (x) { return x.id === pl.id ? Object.assign({}, x, (function () { var o = {}; o[k] = v; return o; })()) : x; }) }); }

            h(F.Radio, { name: 'defplan', checked: S.defaultPlan === pl.id, onChange: function () { set({ defaultPlan: pl.id }); p.hot('plans'); }, label: undefined }),

            h(F.IconButton, { type: 'ghost', icon: 'Trash', label: 'Remove ' + pl.name, disabled: S.plans.length === 1, onClick: function () { var rest = S.plans.filter(function (x) { return x.id !== pl.id; }); set({ plans: rest, defaultPlan: S.defaultPlan === pl.id ? rest[0].id : S.defaultPlan }); } }),
            h('div', { className: 'tr-planmeta' }, (S.defaultPlan === pl.id ? 'Suggested. ' : '') + 'For one ' + money(695) + ' team: ' + planText(pl, 695) + '.'));

          h('div', { style: { marginTop: 8 } }, h(F.HelperText, { state: canAdd ? 'helper' : 'error', size: 'small' }, canAdd ? S.plans.length + ' of 12 plans' : 'You have reached the 12-plan limit. Remove a plan to add another.'))));

          h(F.Switch, { label: 'Let teams join a waitlist when a division is full', checked: S.waitlistOn, onChange: function (v) { set({ waitlistOn: v }); p.hot('waitlist'); } }),
          h(F.Select, { label: 'When a spot opens', disabled: !S.waitlistOn, value: S.offerMode, onChange: function (v) { set({ offerMode: v }); }, options: [{ value: 'auto', label: 'Offer it to the next team automatically' }, { value: 'manual', label: 'Ask me to approve each offer' }] }),
          h(F.NumberInput, { label: 'Hours a team has to claim the spot', value: S.claimHours, min: 1, max: 168, disabled: !S.waitlistOn, helperText: 'Shown to clubs in their cart.', onChange: function (v) { var n = parseInt(v, 10); if (!isNaN(n)) set({ claimHours: n }); } }),

      h('div', { className: 'tr-org__head' }, h('h1', null, 'Capital Cup 2027'), h('p', null, 'Program settings · Tournament · Apr 17 to 19, 2027')),
      h('div', { className: 'tr-org__grid' },
        h('div', { className: 'tr-org__nav' }, h(F.AnchorTabs, { label: 'Settings sections', value: sec, onChange: setSec, items: [{ value: 'divisions', label: 'Divisions and caps' }, { value: 'plans', label: 'Payment plans' }, { value: 'waitlist', label: 'Waitlist' }] })),
        panel));
  }

  var NOTES = [
    { id: 'cart', title: 'A bulk cart, not one team per checkout', body: 'Organizers often registered returning teams on behalf of busy coaches, one checkout at a time. A shared cart turned that into one session: after launch, one partner registered 96 teams in 30 minutes, down from over 8 hours.', tryIt: 'select all teams and add them in one tap.' },
    { id: 'waitlist', title: 'Caps with a native waitlist', body: 'Full divisions stop silently failing. The team goes on the waitlist at no charge, and the organizer decides how spots are offered.', tryIt: 'add Strikers U11 Girls; its division is full.' },
    { id: 'copy', title: 'One label fixed the most common error', body: 'In testing, registrants typed their own details where organizers expected the child’s. Renaming the field nearly eliminated the error.', tryIt: 'open Add players now on the Team details step, then flip the switch below.' },
    { id: 'plans', title: 'Up to 12 plans, one suggested', body: 'Organizers wanted flexible installments; more choice risks paralysis. Plans are capped at 12 and the organizer’s suggested plan is preselected and listed first.', tryIt: 'switch to Organizer, mark a different plan as suggested, then come back to Payment.' },
    { id: 'mobile', title: 'Mobile-first, open layout', body: 'Nearly every critical action happened on a phone at a field. The registrant flow is one column with a sticky action bar and no nested boxes; advanced details are disclosed only when needed.' },
    { id: 'org', title: 'Two products, two themes', body: 'Clubs register in the Member Portal, in the partner’s colors. Organizers configure in the Management Console. Both run on Fieldhouse, so one change to caps or plans shows up on both sides.', tryIt: 'finish a registration, then switch to Organizer to see counts update.' }
  ];

  function App() {
    var vS = useState('club'), view = vS[0], setView = vS[1];
    var sS = useState({ step: 'teams', sel: {}, teamDiv: {}, cart: [], divs: DIVS0, plans: PLANS0, defaultPlan: 'full', planId: null, waitlistOn: true, offerMode: 'auto', claimHours: 48, oldLabel: false, done: null }), S = sS[0], setS = sS[1];
    var hotS = useState(null), hot = hotS[0], setHot = hotS[1];
    var t = P.useToasts(), host = t[0], toast = t[1];
    function set(patch) { setS(function (s) { return Object.assign({}, s, patch); }); }
    var notes = NOTES.map(function (n) { return n.id === 'copy' ? Object.assign({}, n, { extra: h(F.Switch, { label: 'Show the original label', checked: S.oldLabel, onChange: function (v) { set({ oldLabel: v }); setHot('copy'); } }) }) : n; });
    var tools = h('div', { className: 'px-seg', role: 'group', 'aria-label': 'View as' },
      h('button', { type: 'button', 'aria-pressed': view === 'club', onClick: function () { setView('club'); } }, 'Club director'),
      h('button', { type: 'button', 'aria-pressed': view === 'org', onClick: function () { setView('org'); setHot('org'); } }, 'Organizer'));
    var stage = view === 'club'
      ? h('div', { className: 'tr-stage tr-phone-stage px-phone-stage', 'data-theme': 'member' }, h(P.Phone, { label: 'Club director registration, Member Portal', id: 'tr-screen' }, h(Registrant, { S: S, set: set, toast: toast, hot: setHot, setView: setView })))
      : h('div', { className: 'tr-stage', 'data-theme': 'mgmt', style: { background: 'var(--background-page-default)' } }, h(Organizer, { S: S, set: set, hot: setHot }));
    return h(P.Shell, { title: 'Tournament Engine', subtitle: 'Bulk registration, caps, waitlists and payment plans', backHref: '/#work-tournaments', hot: hot, tools: tools,
      notesIntro: 'The case study decisions, working. Switch between the club director registering teams and the organizer configuring the tournament; both share one state.', notes: notes }, stage, host);
  }
  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
